<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QSD Browser</title>

<!-- Styles -->
<link rel="stylesheet" href="assets/css/style.css">

<!-- Favicon & Apple Touch -->
<link rel="icon" type="image/png" href="https://qsdtimes.vercel.app/assets/images/qsdicons/QSD - New Logo.png">
<link rel="apple-touch-icon" href="https://qsdtimes.vercel.app/assets/images/qsdicons/QSD - New Logo.png">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

<!-- SEO & Social Metadata -->
<meta name="description" content="QueenServeantDonked is a project hosted by producer periyuh, as a social experiment revolving around satirical music, experimental sounds, and controversial topics, with albums releasing on April Fool's Day.">

<!-- Open Graph -->
<meta property="og:title" content="QueenServeantDonked">
<meta property="og:description" content="QueenServeantDonked is a project hosted by producer periyuh, as a social experiment revolving around satirical music, experimental sounds, and controversial topics, with albums releasing on April Fool’s Day.">
<meta property="og:image" content="https://qsdtimes.vercel.app/assets/images/qsdicons/QSD - New Logo.png">
<meta property="og:image:width" content="150">
<meta property="og:image:height" content="150">
<meta property="og:url" content="https://qsdtimes.vercel.app/">
<meta property="og:type" content="website">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="QueenServeantDonked">
<meta name="twitter:description" content="QueenServeantDonked is a project hosted by producer periyuh, as a social experiment revolving around satirical music, experimental sounds, and controversial topics, with albums releasing on April Fool’s Day.">
<meta name="twitter:image" content="https://qsdtimes.vercel.app/assets/images/qsdicons/QSD - New Logo.png">
<meta name="twitter:image:width" content="150">
<meta name="twitter:image:height" content="150">

</head>
<body class="construction browser-page">

<main class="construction-wrapper">

  <!-- Button -->
<div class="btn-row">
    <a href="index.html" class="btn">Main Page</a>
    <a href="shop.html" class="btn">Shop Page</a>
  </div>

  <!-- Search -->
  <div class="browser-search">
    <input id="search" type="text" placeholder="Search albums, tracks, artists..." class="browser-search-input">
    <div id="search-results" class="carousel"></div>
  </div>

  <h2>QSD Albums</h2>
  <div id="qsd-albums" class="product-gallery scroll"></div>

  <h2>Random QSD Tracks</h2>
  <div id="random-tracks" class="product-gallery scroll"></div>

  <h2>Notable Albums</h2>
  <div id="other-albums" class="product-gallery scroll"></div>

  <h2>Artists</h2>
  <div id="artist-carousel" class="product-gallery scroll"></div>

</main>

<!-- Scripts -->
<!-- <script src="assets/js/player.js"></script> -->
<script src="assets/js/browser.js"></script>

</body>
</html>
